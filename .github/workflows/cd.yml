name: Continuous Integration & Continuous Deployment
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    name: Checking build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          cd packages/db && pnpm run db:deploy

      - name: Run build
        run: pnpm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy Everything
    if: contains(github.event.head_commit.message, '[deploy]')
    steps:
      - name: Save pem key
        run: |
          echo "${{secrets.SSH_SECRET}}" &> ~/key.pem
          chmod 600 ~/key.pem
          head -3 ~/key.pem

      - name: Deploy to EC2
        run: |
          ssh -i ~/key.pem -o StrictHostKeyChecking=no ubuntu@"${{secrets.EC2_IP}}" \
          "export PATH=/home/ubuntu/.nvm/versions/node/v22.17.0/bin:\$PATH && \
           cd /home/ubuntu/Draw-app && git pull origin main && pnpm install && \
           pnpm run build && pm2 restart all"
